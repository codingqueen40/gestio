# DEV FILE: Docker Compose loads it AUTOMATICALLY alongside docker-compose.yml.
# No special command needed. This is what happens when you run `docker compose up`.
# Its contents extend or override what is in the base file.
services:
  php:
    ports:
      - "${PHP_PORT:-8080}:80" # expose PHP on your Mac (dev only)
    volumes:
      - ./public:/var/www/html/public # web root (live reload) — same as base
      - ./src:/var/www/html/src # app code, kept OUTSIDE the document root
      - ./php/dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini:ro # re-enable display_errors IN DEV only
    environment:
      APP_ENV: development # PHP can read this variable to adapt its behavior

  mysql:
    ports:
      - "${MYSQL_PORT:-3306}:3306" # expose MySQL on your Mac → for DBeaver, MySQL Workbench
        # In prod this line is gone: MySQL stays hidden

  # phpMyAdmin exists ONLY in dev. Never in prod.
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gestio_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80" # reachable on localhost:8081
    environment:
      PMA_HOST: mysql # connects only to the internal mysql service
      PMA_ARBITRARY: 0 # forbids connecting to another server (compartmentalization)
      # NO PMA_USER, NO PMA_PASSWORD → login form shown, safer even in dev
      UPLOAD_LIMIT: 64M
    depends_on:
      - mysql
    networks:
      - gestio_network
