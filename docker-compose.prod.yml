# PROD FILE: does NOT load on its own.
# Run it with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# It overrides some base settings to harden the deployment.
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - php

  php:
    restart: always
    environment:
      APP_ENV: production
      # URL publique canonique : utilisée pour bâtir les liens des emails
      # (reset mot de passe) sans dépendre de l'en-tête Host du client (#42).
      APP_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # NO "ports:" → PHP is NOT exposed directly; Caddy reverse-proxies to it
    security_opt:
      - no-new-privileges:true
    read_only: false

  mysql:
    restart: always
    # NO "ports:" → MySQL is NEVER reachable from the outside in prod
    #
    # PAS de "command:" ici. L'option --default-authentication-plugin a été
    # SUPPRIMÉE dans MySQL 8.4.0 (dépréciée en 8.0.27) — mysqld refuse de démarrer
    # sur une option inconnue, il ne l'ignore pas. Elle est remplacée par
    # authentication_policy, mais caching_sha2_password est DÉJÀ le défaut en 8.4 :
    # il n'y a donc rien à configurer.
    # --bind-address était inutile aussi : l'image officielle écoute déjà sur 0.0.0.0.
    # Réf : https://dev.mysql.com/doc/relnotes/mysql/8.4/en/news-8-4-0.html
    security_opt:
      - no-new-privileges:true

  # WARNING: no phpmyadmin section here!
  # To admin the database in prod: SSH tunnel + local phpMyAdmin, or Adminer.

volumes:
  caddy_data:
  caddy_config:
