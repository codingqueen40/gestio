# PROD FILE: does NOT load on its own.
# Run it with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# It overrides some base settings to harden the deployment.
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - php

  php:
    restart: always
    environment:
      APP_ENV: production
      # URL publique canonique : utilisée pour bâtir les liens des emails
      # (reset mot de passe) sans dépendre de l'en-tête Host du client (#42).
      APP_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # NO "ports:" → PHP is NOT exposed directly; Caddy reverse-proxies to it
    security_opt:
      - no-new-privileges:true
    read_only: false

  mysql:
    restart: always
    # NO "ports:" → MySQL is NEVER reachable from the outside in prod
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --bind-address=0.0.0.0
    security_opt:
      - no-new-privileges:true

  # WARNING: no phpmyadmin section here!
  # To admin the database in prod: SSH tunnel + local phpMyAdmin, or Adminer.

volumes:
  caddy_data:
  caddy_config:
