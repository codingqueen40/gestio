# Headers de sécurité — ticket #23.
# Portés par l'application (Apache), pas par le reverse proxy.
# Fonctionnent derrière Traefik (Coolify), derrière Caddy, ou sans proxy.
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
</IfModule>

# Ne pas révéler la version d'Apache ni l'OS.
ServerTokens Prod
ServerSignature Off
